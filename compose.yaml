services:
  gateway:
    build: ./01-llm-security-gateway
    environment:
      APP_TITLE: "LLM Security Gateway"
      APP_KIND: "gateway"
      ADMIN_USER: "${ADMIN_USER:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?Set a strong ADMIN_PASSWORD in .env}"
      DEMO_MODE: "${DEMO_MODE:-true}"
      DB_PATH: /data/app.db
    ports:
      - "127.0.0.1:8101:8080"
    volumes:
      - gateway_data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
  agent:
